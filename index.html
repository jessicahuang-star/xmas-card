<style>
:root{
  --navy:#0b2236;
  --cream:#fff8ea;
  --gold:#f3cf7a;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--navy);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation;
  font-family:"Noto Serif TC","Songti TC","PMingLiU",serif;color:var(--cream)}
img{-webkit-user-drag:none;user-select:none}

/* 模糊背景:桌機或比例不同時補滿兩側 */
.backdrop{position:fixed;inset:-40px;background:var(--navy) center/cover no-repeat;filter:blur(26px) brightness(.62) saturate(1.1);transition:background-image .1s}

.scene{position:fixed;inset:0;visibility:hidden}
.scene.active{visibility:visible}
.stage{position:absolute;left:0;top:0;transform-origin:0 0}
.stage > *, .rig > *{position:absolute}
.full{left:0;top:0;width:100%;height:100%}

/* ── 第一幕:抽獎機(畫布 1024×1536) ── */
#s1 .stage{width:1024px;height:1536px}
.bg1{left:-288px;top:-432px;width:1600px;height:2400px}
body.wide .bg1{left:-1024px;top:-120px;width:3072px;height:1776px}
.title1{left:217px;top:6px;width:590px;filter:drop-shadow(0 6px 14px rgba(0,0,0,.45))}
.rig{left:0;top:0;width:1024px;height:1536px;transform-origin:512px 1230px}
.ground-shadow{left:150px;top:1188px;width:724px;height:86px;border-radius:50%;
  background:radial-gradient(ellipse at 50% 50%,rgba(8,22,40,.55) 0%,rgba(8,22,40,.25) 45%,rgba(8,22,40,0) 72%)}
.bed{left:162px;top:700px;width:700px;height:235px}
.globe{left:0;top:0;width:1024px;height:1536px;clip-path:ellipse(335px 325px at 508px 548px);-webkit-clip-path:ellipse(335px 325px at 508px 548px)}
.globe > *{position:absolute}
.ball{left:0;top:0;will-change:transform}
.powder{left:0;top:0;width:1024px;height:1536px}
.glass{clip-path:inset(0 0 41.40625% 0);-webkit-clip-path:inset(0 0 41.40625% 0)}
.ballout{left:0;top:0;width:131px;height:131px;opacity:0;will-change:transform,opacity}
.ballout img{width:100%;height:100%;display:block}
.ballout::before{content:"";position:absolute;inset:-60%;border-radius:50%;
  background:radial-gradient(circle,rgba(255,244,214,.75) 0%,rgba(255,226,160,.25) 40%,transparent 70%);
  opacity:var(--glow,0);transition:opacity .6s}
.burst{left:0;top:0;width:1024px;height:1536px;pointer-events:none}

.wish{left:262px;top:1296px;width:500px;height:167px;padding:0;border:0;background:none;cursor:pointer;
  border-radius:90px;outline-offset:6px;transition:transform .15s ease,opacity .45s ease,filter .3s}
.wish img{width:100%;height:100%;display:block;pointer-events:none}
.wish::after{content:"";position:absolute;inset:6% 3%;border-radius:90px;box-shadow:0 0 0 0 rgba(255,214,130,.55);animation:pulse 2.2s ease-out infinite}
.wish:hover{filter:brightness(1.08)}
.wish:active{transform:scale(.95)}
.wish:focus-visible{outline:4px solid var(--gold)}
.wish[disabled]{opacity:0;pointer-events:none}
.wish[disabled]::after{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,214,130,.6)}70%{box-shadow:0 0 0 34px rgba(255,214,130,0)}100%{box-shadow:0 0 0 0 rgba(255,214,130,0)}}
.wish .shine{position:absolute;inset:0;border-radius:90px;overflow:hidden;pointer-events:none}
.wish .shine::before{content:"";position:absolute;top:0;bottom:0;width:30%;left:-40%;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);animation:shine 3.6s ease-in-out 1s infinite}
@keyframes shine{0%{left:-40%}45%,100%{left:120%}}

/* ── 結果頁:背景與木座 Logo 跟著畫布(941×1672)縮放;文字層用螢幕座標,小視窗也不會被裁切 ── */
#s2 .stage{width:941px;height:1672px;background:var(--fallback,#2b2f6b);box-shadow:0 0 0 4000px var(--fallback,#2b2f6b)}
.rbg{left:-300px;top:-420px;width:1541px;height:2512px}
.rbg-wide{display:none;left:-1100px;top:-120px;width:4241px;height:1912px}
body.wide .rbg-wide{display:block}
body.wide .rbg{-webkit-mask-image:linear-gradient(90deg,transparent 21%,#000 30%,#000 70%,transparent 79%);
  mask-image:linear-gradient(90deg,transparent 21%,#000 30%,#000 70%,transparent 79%)}
.r-logo{left:365px;top:1342px;width:210px;opacity:.95;
  filter:drop-shadow(0 1px 1px rgba(0,0,0,.6)) drop-shadow(0 0 12px rgba(255,236,200,.28))}

.r-ui{position:absolute;inset:0;pointer-events:none;color:var(--ink,#fff);
  text-shadow:0 1px 3px var(--halo,rgba(0,0,0,.6)),0 0 18px var(--halo,rgba(0,0,0,.5))}
.r-ui button{pointer-events:auto}
.r-wishbox{position:absolute;left:16px;right:16px;top:var(--wy,16%);text-align:center}
.r-title{display:block;width:min(80vw,360px);margin:0 auto 4px;filter:drop-shadow(0 3px 10px rgba(0,0,0,.45))}
#s2[data-tone="light"] .r-title{filter:drop-shadow(0 1px 2px rgba(90,45,15,.6)) drop-shadow(0 4px 14px rgba(90,45,15,.45))}
.r-wish{display:inline-block;margin:0;font-size:clamp(16px,4.6vw,20px);font-weight:600;line-height:1.8;letter-spacing:.08em;white-space:nowrap}
.r-bottom{position:absolute;left:0;right:0;bottom:max(18px,calc(env(safe-area-inset-bottom) + 10px));
  display:flex;flex-direction:column;align-items:center;gap:12px}
.r-sign{margin:0;font-size:13px;font-weight:600;letter-spacing:.16em}
.replay{font:600 14px/1 "Noto Serif TC","Songti TC",serif;letter-spacing:.12em;color:inherit;text-shadow:none;
  background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.55);border-radius:40px;padding:11px 24px;cursor:pointer;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.replay:hover{background:rgba(255,255,255,.26)}
.replay:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#s2[data-tone="light"] .replay{background:rgba(255,255,255,.45);border-color:rgba(120,60,30,.35)}

/* 橫向(桌機):水晶球在左、文字統一在右 */
body.wide .r-ui{left:var(--colL,50vw);right:3vw;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:clamp(20px,5vh,52px)}
body.wide .r-wishbox,body.wide .r-bottom{position:static}
body.wide .r-title{width:min(100%,36vw,64vh);margin-bottom:clamp(6px,2vh,22px)}
body.wide .r-wish{font-size:clamp(17px,min(1.7vw,3.4vh),30px)}
body.wide .r-sign{font-size:clamp(12px,min(1.05vw,2.2vh),17px)}
body.wide .replay{font-size:clamp(13px,min(1vw,2.2vh),17px)}

.reveal{opacity:0;transform:translateY(20px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}
#s2.show .reveal{opacity:1;transform:none}
#s2.show .d1{transition-delay:.25s}
#s2.show .d2{transition-delay:.8s}
#s2.show .d3{transition-delay:1.3s}
#s2.show .d4{transition-delay:1.7s}

/* 全畫面飄雪、白色轉場、載入 */
.snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity var(--fd,.8s) ease}
.flash.on{opacity:1}
.loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:radial-gradient(ellipse at 50% 40%,#173a57,#0b2236 70%);color:#dfeaf2;font-size:15px;letter-spacing:.2em;transition:opacity .6s}
.loader.done{opacity:0;pointer-events:none}
.loader .flake{font-size:42px;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

@media (prefers-reduced-motion:reduce){
  .wish::after,.wish .shine::before,.loader .flake{animation:none}
}
</style>
</head>
<body>
<div class="backdrop" id="backdrop"></div>

<section class="scene active" id="s1" aria-label="水晶雪球抽獎機">

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);

/* ── 5 種結果:背景、祝福語、配色 ── */
const RESULTS = [
  { img:'assets/result-1.jpg', key:'平安喜樂', lines:['願您與家人平安喜樂','每一個心願，都被溫柔回應'],
    ink:'#fff', keyc:'#ffe7a8', halo:'rgba(30,20,70,.8)', tone:'dark', fb:'linear-gradient(#232a63,#6d5fb0 60%,#3d356f)' },
  { img:'assets/result-2.jpg', key:'團圓美滿', lines:['願新的一年闔家團圓','餐桌熱鬧，笑聲滿屋'],
    ink:'#fff', keyc:'#fff1c9', halo:'rgba(110,20,30,.75)', tone:'dark', fb:'linear-gradient(#b8485a,#e7938f 60%,#a84a55)' },
  { img:'assets/result-3.jpg', key:'財源滾滾', lines:['願好運與財富如禮物般','一份接一份來到您身邊'],
    ink:'#5a2a12', keyc:'#9b2a1e', halo:'rgba(255,245,225,.9)', tone:'light', fb:'linear-gradient(#e9cfa6,#f6e6cc 60%,#d9b98a)' },
  { img:'assets/result-4.jpg', key:'好運送到', lines:['願美好的機會一路奔向您','事業順風，步步高升'],
    ink:'#fff', keyc:'#d8ffe9', halo:'rgba(0,45,50,.8)', tone:'dark', fb:'linear-gradient(#063f45,#0f8a82 60%,#08515a)' },
  { img:'assets/result-5.jpg', key:'溫暖安康', lines:['願您的家燈火溫暖','身體健康，日日安心'],
    ink:'#fff', keyc:'#ffe2a0', halo:'rgba(70,35,5,.8)', tone:'dark', fb:'linear-gradient(#6b3d12,#c98a3c 60%,#7a4a18)' },
];
// 每張圖木座中段的 y(畫布座標),Logo 壓在這裡;桌機用的寬版底圖
const LOGO_Y = [1365, 1358, 1362, 1352, 1368];
RESULTS.forEach((r, i) => { r.ly = LOGO_Y[i]; r.wide = r.img.replace('.jpg', '-wide.jpg'); });
let pick = -1;
const preloaded = [];
function preload(src){ const im = new Image(); im.src = src; preloaded.push(im); }
function choose(){
  let n; do { n = Math.floor(Math.random()*RESULTS.length); } while (n === pick && RESULTS.length > 1);
  pick = n;
  preload(RESULTS[n].img);
  if (wide) preload(RESULTS[n].wide);
}

/* ── 畫布縮放:手機滿版(cover),但保證主體不被裁切 ── */
function place(stage, s, tx, ty){ stage.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; return { s, tx, ty }; }
function fit(stage, W, H, safeW, safeH){
  const vw = innerWidth, vh = innerHeight;
  let s = Math.max(vw/W, vh/H);
  s = Math.min(s, vw/safeW, vh/safeH);
  return place(stage, s, (vw-W*s)/2, (vh-H*s)/2);
}
/* 結果頁版面:直向=滿版置中,祝福語在天空;橫向=水晶球在左(30%)、文字欄在右 */
function layoutResult(){
  const vw = innerWidth, vh = innerHeight, st = $('stage2'), ui = $('rui');
  if (wide){
    const s = Math.min(vh/1560, vw*0.52/941);
    const { tx } = place(st, s, vw*0.3 - 470.5*s, (vh - 1672*s)/2);
    ui.style.setProperty('--colL', Math.max(vw*0.47, tx + 860*s + 24) + 'px');
  } else {
    let { s, ty } = fit(st, 941, 1672, 820, 1560);
    // 底部文字區(敬賀文字+再許一次願)預留空間:木座底(y≈1455)不能被蓋到;不夠就往上推,再不夠就縮小
    const rb = document.querySelector('.r-bottom');
    const avail = vh - (rb.offsetHeight + parseFloat(getComputedStyle(rb).bottom || 18)) - 10;
    s = Math.min(s, (avail - 100) / 855);
    ty = Math.min((vh - 1672*s)/2, avail - 1455*s);
    place(st, s, (vw - 941*s)/2, ty);
    ui.style.setProperty('--wy', Math.max(12, ty + 70*s) + 'px');
  }
  setWish();
}
/* 祝福語:預設一行;一行寬度超過畫面一半(或文字欄寬)就改成兩行 */
function setWish(){
  if (pick < 0) return;
  const r = RESULTS[pick], el = $('rwish');
  el.textContent = r.lines.join('，');
  const limit = Math.min(innerWidth/2, $('rui').clientWidth - 8);
  if (el.offsetWidth > limit) el.innerHTML = r.lines.map(l => `<span style="display:block">${l}</span>`).join('');
}
let wide = null;
function layout(){
  // 橫向(桌機、平板橫放、手機橫拿)→ 寬版背景 + 結果頁左右版型
  const w = innerWidth / innerHeight >= 1.1;
  if (w !== wide){
    wide = w;
    document.body.classList.toggle('wide', w);
    const bg = w ? 'assets/bg-wide.jpg' : 'assets/bg-stage.jpg';
    document.querySelector('.bg1').src = bg;
    if ($('s1').classList.contains('active')) $('backdrop').style.backgroundImage = `url(${bg})`;
  }
  fit($('stage1'), 1024, 1536, 840, 1490);
  if (wide && pick >= 0 && !$('rbgw').getAttribute('src') && $('s2').classList.contains('active')) $('rbgw').src = RESULTS[pick].wide;
  layoutResult();
  snow.resize();
}

/* ── 球內雪球 ── */
const HOME = [[305,683,112],[462,684,106],[603,679,112],[705,704,112],[385,714,118],[551,712,120],[256,739,116],
              [330,770,122],[473,753,126],[630,749,120],[737,751,122],[414,800,132],[540,802,133],[658,792,126]];
const C = {x:508, y:548}, R = 318;
const balls = HOME.map(([x,y,d]) => {
  const el = document.createElement('img');
  el.src = 'assets/snowball.webp'; el.className = 'ball'; el.alt = '';
  const size = d/.84; el.style.width = el.style.height = size+'px';
  $('globe').insertBefore(el, $('powder'));
  return { el, hx:x, hy:y, d, size, x, y, vx:0, vy:0, z:0, ph:rand(0,6.28), sp:rand(2.2,4.2), rot:0, vr:0 };
});
function drawBalls(){
  const order = balls.slice().sort((a,b) => a.z - b.z);
  order.forEach((b,i) => {
    const sc = 1 + b.z*.16;
    b.el.style.zIndex = i;
    b.el.style.transform = `translate(${b.x-b.size/2}px,${b.y-b.size/2}px) scale(${sc}) rotate(${b.rot}deg)`;
    b.el.style.opacity = (.82 + (b.z+1)*.09).toFixed(2);
  });
}
function resetBalls(){ balls.forEach(b => { b.x=b.hx; b.y=b.hy; b.vx=b.vy=0; b.z=0; b.rot=0; }); drawBalls(); }
resetBalls();

/* ── 球內雪粉(半解析度畫布) ── */
const pw = $('powder').getContext('2d');
let dust = [];
function windField(p, t, k){
  // 繞中心旋轉的風 + 由下往上的陣風 + 每顆不同的擾動 + 向心力(避免全部貼在球壁)
  const dx = p.x - C.x, dy = p.y - C.y, dist = Math.hypot(dx,dy) || 1;
  const swirl = 1500*k, ph = p.ph || 0;
  return {
    ax: (-dy/dist)*swirl + Math.sin(t*3.1 + ph*5 + p.y*.015)*1600*k - dx*4*k,
    ay: ( dx/dist)*swirl - 700*k + Math.cos(t*2.7 + ph*3 + p.x*.015)*1600*k - dy*4*k,
  };
}
function drawDust(dt, t, k){
  if (k > 0) for (let i=0;i<7;i++) dust.push({ x:rand(260,760), y:rand(770,830), vx:rand(-80,80), vy:rand(-420,-160), r:rand(1.5,4.5), a:rand(.5,1), life:rand(1.4,2.6) });
  pw.clearRect(0,0,512,768);
  dust = dust.filter(p => (p.life -= dt) > 0);
  for (const p of dust){
    if (k > 0){ const f = windField(p,t,k*.7); p.vx += f.ax*dt; p.vy += f.ay*dt; }
    else p.vy += 260*dt;
    p.vx *= .97; p.vy *= .97; p.x += p.vx*dt; p.y += p.vy*dt;
    pw.globalAlpha = Math.min(1, p.life) * p.a;
    pw.fillStyle = '#fff';
    pw.beginPath(); pw.arc(p.x/2, p.y/2, p.r/2, 0, 6.283); pw.fill();
  }
  pw.globalAlpha = 1;
}

/* ── 全畫面飄雪 ── */
const snow = (() => {
  const cv = $('snow'), cx = cv.getContext('2d');
  let W=0, H=0, dpr=1, flakes=[], gust=0;
  function resize(){
    dpr = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(110, W*H/9000));
    while (flakes.length < n) flakes.push(mk(true));
    flakes.length = n;
  }
  function mk(any){ return { x:rand(0,W), y:any?rand(0,H):-10, r:rand(.8,3.2), v:rand(18,55), sw:rand(.5,1.6), ph:rand(0,6.28), a:rand(.45,.95) }; }
  function step(dt, t){
    cx.clearRect(0,0,W,H);
    cx.fillStyle = '#fff';
    for (const f of flakes){
      f.y += (f.v*(1+gust*.8) + f.r*6) * dt;
      f.x += (Math.sin(t*f.sw + f.ph)*14 + gust*320*(.5+f.r/3)) * dt;
      if (f.y > H+10 || f.x > W+20 || f.x < -20){ Object.assign(f, mk(false)); if (gust>.2) { f.x = rand(-W*.4, W*.8); f.y = rand(-10,H*.6); } }
      cx.globalAlpha = f.a; cx.beginPath(); cx.arc(f.x,f.y,f.r,0,6.283); cx.fill();
    }
    cx.globalAlpha = 1;
  }
  return { resize, step, set gust(v){ gust=v; }, get gust(){ return gust; } };
})();

/* ── 碎雪爆開 ── */
const bc = $('burst').getContext('2d');
const atlas = new Image(); atlas.src = 'assets/fragments.webp';
let shards = [], puffs = [];
function explode(x, y, r){
  shards = []; puffs = [];
  const n = reduce ? 8 : 16;
  for (let i=0;i<n;i++){
    const ang = (i/n)*6.283 + rand(-.25,.25), sp = rand(700,1500);
    shards.push({ x:x+Math.cos(ang)*r*.3, y:y+Math.sin(ang)*r*.3, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-300,
      cell:i%6, s:rand(110,200), rot:rand(0,6.28), vr:rand(-6,6), life:1.6 });
  }
  for (let i=0;i<(reduce?80:320);i++){
    const ang = rand(0,6.283), sp = rand(150,1300);
    puffs.push({ x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, r:rand(2,11), life:rand(.9,1.9) });
  }
}
function drawBurst(dt){
  if (!shards.length && !puffs.length) return;
  bc.clearRect(0,0,1024,1536);
  shards = shards.filter(s => (s.life -= dt) > 0);
  for (const s of shards){
    s.vy += 900*dt; s.vx *= .985; s.x += s.vx*dt; s.y += s.vy*dt; s.rot += s.vr*dt;
    const cw = atlas.naturalWidth/3, ch = atlas.naturalHeight/2;
    bc.save(); bc.globalAlpha = Math.min(1, s.life*1.4); bc.translate(s.x,s.y); bc.rotate(s.rot);
    if (cw) bc.drawImage(atlas, (s.cell%3)*cw, Math.floor(s.cell/3)*ch, cw, ch, -s.s/2, -s.s/2, s.s, s.s);
    bc.restore();
  }
  puffs = puffs.filter(p => (p.life -= dt) > 0);
  bc.fillStyle = '#fff';
  for (const p of puffs){
    p.vx *= .94; p.vy = p.vy*.94 + 60*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    bc.globalAlpha = Math.min(1, p.life); bc.beginPath(); bc.arc(p.x,p.y,p.r,0,6.283); bc.fill();
  }
  bc.globalAlpha = 1;
  if (!shards.length && !puffs.length) bc.clearRect(0,0,1024,1536);
}

/* ── 主迴圈 ── */
let mode = 'idle', modeT = 0, modeStart = 0, last = performance.now(), T = 0;
const WIND = reduce ? .9 : 2.4, SETTLE = .75;
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now; T += dt;
  modeT = (now - modeStart)/1000;
  snow.step(dt, T);
  if (mode === 'wind' || mode === 'settle'){
    if (mode === 'wind'){
      const k = Math.min(1, modeT/.35) * (modeT > WIND-.3 ? Math.max(0,(WIND-modeT)/.3) : 1);
      snow.gust = k;
      for (const b of balls){
        const f = windField(b, T, k);
        b.vx += (f.ax + rand(-600,600)*k)*dt; b.vy += (f.ay + rand(-600,600)*k)*dt + 900*dt*(1-k);
        b.vx *= .975; b.vy *= .975;
        b.x += b.vx*dt; b.y += b.vy*dt;
        const lim = R - b.d*.5, dx = b.x-C.x, dy = b.y-C.y, d = Math.hypot(dx,dy);
        if (d > lim){ const nx=dx/d, ny=dy/d, dot=b.vx*nx+b.vy*ny; b.x=C.x+nx*lim; b.y=C.y+ny*lim; if (dot>0){ b.vx-=1.7*dot*nx; b.vy-=1.7*dot*ny; } }
        b.z = Math.sin(T*b.sp + b.ph) * k;
        b.rot += (b.vx*.08)*dt*10;
      }
      drawDust(dt, T, k);
      if (modeT >= WIND){ mode='settle'; modeStart=now; modeT=0; balls.forEach(b => { b.sx=b.x; b.sy=b.y; b.sz=b.z; b.sr=b.rot; }); }
    } else {
      const p = Math.min(1, modeT/SETTLE), e = 1-Math.pow(1-p,3);
      snow.gust = 0;
      for (const b of balls){
        b.x = b.sx + (b.hx-b.sx)*e;
        b.y = b.sy + (b.hy-b.sy)*e + Math.sin(p*Math.PI)*-18*(1-p);
        b.z = b.sz*(1-e); b.rot = b.sr*(1-e);
      }
      drawDust(dt, T, 0);
      if (p >= 1) mode = 'idle';
    }
    drawBalls();
  } else if (dust.length) drawDust(dt, T, 0);
  drawBurst(dt);
  requestAnimationFrame(loop);
}

/* ── 出球動畫 ── */
function rollOut(){
  const el = $('ballout'), D = 131, P = (x,y,s,r) => `translate(${x-D/2}px,${y-D/2}px) scale(${s}) rotate(${r}deg)`;
  el.style.setProperty('--glow', 0);
  const anim = el.animate([
    { offset:0,   transform:P(505,1062,.62,0),   opacity:0, filter:'brightness(.3)' },
    { offset:.12, transform:P(505,1088,.8,40),   opacity:1, filter:'brightness(.55)' },
    { offset:.3,  transform:P(508,1172,1.05,140),opacity:1, filter:'brightness(1)' },
    { offset:.46, transform:P(516,1338,1.55,280),opacity:1, filter:'brightness(1.02)', easing:'ease-out' },
    { offset:.55, transform:P(518,1296,1.62,315),opacity:1, filter:'brightness(1.04)', easing:'ease-in' },
    { offset:.62, transform:P(518,1342,1.7,340), opacity:1, filter:'brightness(1.06)', easing:'cubic-bezier(.3,.7,.3,1)' },
    { offset:1,   transform:P(512,770,3.4,420),  opacity:1, filter:'brightness(1.12)' },
  ], { duration: reduce ? 1100 : 2300, fill:'forwards', easing:'linear' });
  setTimeout(() => el.style.setProperty('--glow', 1), reduce ? 600 : 1500);
  const dur = reduce ? 1100 : 2300;
  return Promise.race([anim.finished, sleep(dur + 400)]).then(() => anim);
}

/* ── 流程 ── */
const flash = $('flash');
async function whiteIn(ms){ flash.style.setProperty('--fd', ms+'ms'); flash.classList.add('on'); await sleep(ms+30); }
async function whiteOut(ms){ flash.style.setProperty('--fd', ms+'ms'); flash.classList.remove('on'); await sleep(ms); }

async function makeWish(){
  if (mode !== 'idle') return;
  const btn = $('wish'); btn.disabled = true;
  mode = 'wind'; modeT = 0; modeStart = performance.now();
  if (navigator.vibrate) try { navigator.vibrate(30); } catch(e){}
  let shake = null;
  if (!reduce) shake = $('rig').animate([
    {transform:'rotate(0deg)'},{transform:'rotate(-1.1deg) translateX(-4px)'},{transform:'rotate(1.2deg) translateX(4px)'},
    {transform:'rotate(-.8deg)'},{transform:'rotate(.9deg)'},{transform:'rotate(0deg)'}
  ], { duration:420, iterations:Math.round(WIND/.42), easing:'ease-in-out' });
  await sleep((WIND + SETTLE*.8)*1000);
  if (shake) shake.cancel();
  const anim = await rollOut();
  // 雪球散開
  $('ballout').style.opacity = 0; anim.cancel(); $('ballout').style.setProperty('--glow',0);
  explode(512, 770, 220);
  if (navigator.vibrate) try { navigator.vibrate([20,40,30]); } catch(e){}
  await sleep(220);
  await whiteIn(reduce ? 400 : 750);
  await showResult();
}

async function showResult(){
  const r = RESULTS[pick], s2 = $('s2'), img = $('rbg');
  s2.style.setProperty('--ink', r.ink); s2.style.setProperty('--key', r.keyc); s2.style.setProperty('--halo', r.halo);
  $('stage2').style.setProperty('--fallback', r.fb);
  s2.dataset.tone = r.tone;
  $('rlogo').style.top = (r.ly - 20) + 'px';
  img.style.visibility = '';   // 清除先前的隱藏狀態;不可設成 visible,否則會蓋過場景切換而一直顯示
  img.src = r.img;
  if (wide) $('rbgw').src = r.wide; else $('rbgw').removeAttribute('src');
  layoutResult();
  await Promise.race([img.complete && img.naturalWidth ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = () => { img.style.visibility = 'hidden'; r(); }; }), sleep(4000)]);
  $('backdrop').style.backgroundImage = `url(${r.img})`;
  $('s1').classList.remove('active');
  s2.classList.add('active'); s2.classList.remove('show');
  await sleep(250);
  whiteOut(reduce ? 400 : 1000);
  await sleep(250);
  s2.classList.add('show');
  const vis = [...document.querySelectorAll('#s2 .replay')].find(b => b.offsetParent);
  if (vis) vis.focus({preventScroll:true});
}

async function replay(){
  await whiteIn(450);
  $('s2').classList.remove('active','show');
  $('s1').classList.add('active');
  $('backdrop').style.backgroundImage = `url(${wide ? 'assets/bg-wide.jpg' : 'assets/bg-stage.jpg'})`;
  resetBalls(); dust = []; mode = 'idle';
  const btn = $('wish'); btn.disabled = false;
  choose();
  await whiteOut(600);
  btn.focus({preventScroll:true});
}

/* ── 啟動:等第一幕素材載入完才顯示 ── */
async function boot(){
  layout();
  addEventListener('resize', layout);
  const imgs = [...document.querySelectorAll('#s1 img')];
  await Promise.race([
    Promise.all(imgs.map(i => i.complete ? Promise.resolve() : new Promise(r => { i.onload = i.onerror = r; }))),
    sleep(6000),
  ]);
  $('loader').classList.add('done');
  choose();
  preload('assets/logo-white.webp'); preload('assets/title-silver.webp');
  if (document.fonts) document.fonts.ready.then(() => setWish());
  $('wish').addEventListener('click', makeWish);
  document.querySelectorAll('.replay').forEach(b => b.addEventListener('click', replay));
  // 檢查用:網址加 ?preview=1~5 直接看指定結果頁
  const pv = parseInt(new URLSearchParams(location.search).get('preview'), 10);
  if (pv >= 1 && pv <= RESULTS.length){ pick = pv - 1; $('wish').disabled = true; mode = 'done'; showResult(); }
  requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
}
boot();
})();
</script>
