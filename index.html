<style>
:root{

.reveal{opacity:0;transform:translateY(20px);transition:opacity .9s ease,transform .9s cubic-bezier(.2,.8,.2,1)}

.snow{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}

  background:rgba(10,25,40,.32);border:1px solid rgba(255,255,255,.4);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);

.loader{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;

<body>

  <svg class="i-on" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
  <svg class="i-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 9.5l5 5M21.5 9.5l-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
</button>

<script>
(() => {
'use strict';
const $ = id => document.getElementById(id);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const rand = (a, b) => a + Math.random() * (b - a);

/* ── 音效與配樂:Web Audio 即時合成(無音檔;曲目皆為無版權傳統聖誕歌) ──
   wish(總長, 風吹秒數):八音盒〈We Wish You a Merry Christmas〉前兩句 + 風吹時的輕柔雪橇鈴
   bell()              :雪球散開時的手搖鈴 + 往上飄的閃爍音
   music(第幾張)       :結果頁配樂,每張一首,循環播放;stopMusic() 淡出
   使用者第一次點擊才建立音訊(瀏覽器規定);右上角可靜音並記住;切到別的 App 時暫停 */
const sfx = (() => {
  const VOL = 0.6;
  let ctx = null, master, bus, noise, on = true;
  let song = null, pendingSong = null;
  try { on = localStorage.getItem('xmas-sound') !== 'off'; } catch(e){}
  function init(){
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return false;
    if (!ctx){
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = on ? VOL : 0; master.connect(ctx.destination);
      const len = Math.floor(ctx.sampleRate * 2.6), ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let c = 0; c < 2; c++){ const d = ir.getChannelData(c); for (let i = 0; i < len; i++) d[i] = (Math.random()*2-1) * Math.pow(1 - i/len, 3); }
      const conv = ctx.createConvolver(); conv.buffer = ir;
      const wet = ctx.createGain(); wet.gain.value = 0.35;
      conv.connect(wet); wet.connect(master);
      bus = ctx.createGain(); bus.connect(master); bus.connect(conv);
      noise = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
      const nd = noise.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random()*2-1;
    }
    if (ctx.state === 'suspended' && !document.hidden) ctx.resume();
    return true;
  }
  function tone(f, t, dur, peak, dest, type){
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(peak, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || bus); o.start(t); o.stop(t + dur + 0.05);
  }
  function musicBox(f, t, dest, amp){
    const a = amp || 1;
    tone(f, t, 1.8, .15*a, dest); tone(f*2, t, 1.0, .045*a, dest); tone(f*3.01, t, .5, .02*a, dest); tone(f*5.4, t, .1, .025*a, dest);
  }
  function jingle(t, amp, dest){
    const src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = noise; bp.type = 'bandpass'; bp.frequency.value = rand(5200, 8200); bp.Q.value = 5;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.1);
    src.connect(bp); bp.connect(g); g.connect(dest || bus); src.start(t, rand(0, .8), .12);
    tone(rand(3800, 6400), t, .14, amp * .35, dest);
  }
  // 柔和和弦鋪底(兩支微走音三角波 + 低通),低音一聲
  function pad(freqs, t, dur, dest){
    const lp = ctx.createBiquadFilter(), g = ctx.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 1100;
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.022, t + .35);
    g.gain.setValueAtTime(.022, t + Math.max(.4, dur - .3)); g.gain.linearRampToValueAtTime(0, t + dur + .25);
    lp.connect(g); g.connect(dest);
    for (const f of freqs) for (const det of [-5, 5]){
      const o = ctx.createOscillator(); o.type = 'triangle'; o.frequency.value = f; o.detune.value = det;
      o.connect(lp); o.start(t); o.stop(t + dur + .3);
    }
  }
  const SEMI = { C:0, 'C#':1, Db:1, D:2, 'D#':3, Eb:3, E:4, F:5, 'F#':6, Gb:6, G:7, 'G#':8, Ab:8, A:9, 'A#':10, Bb:10, B:11 };
  const hz = name => { const m = name.match(/^([A-G][#b]?)(\d)$/); return 440 * Math.pow(2, (SEMI[m[1]] + (+m[2] + 1) * 12 - 69) / 12); };
  function chordHz(name){
    const m = name.match(/^([A-G][#b]?)(m?)$/), root = SEMI[m[1]];
    const midi = 48 + root;                      // 和弦放在 C3~B3 一帶
    const iv = m[2] ? [0, 3, 7] : [0, 4, 7];
    return { pad: iv.map(x => 440 * Math.pow(2, (midi + x + 12 - 69) / 12)), bass: 440 * Math.pow(2, (midi - 12 - 69) / 12) };
  }
  // 旋律 [音, 拍];和弦 [從第幾拍, 和弦, 拍數];beat = 每拍秒數;oct = 旋律升幾個八度(八音盒音域)

/* ── 畫布縮放:手機滿版(cover),但保證主體不被裁切 ── */
function place(stage, s, tx, ty){ stage.style.transform = `translate(${tx}px,${ty}px) scale(${s})`; return { s, tx, ty }; }
function fit(stage, W, H, safeW, safeH){
  const vw = innerWidth, vh = innerHeight;
  let s = Math.max(vw/W, vh/H);
  s = Math.min(s, vw/safeW, vh/safeH);
  return place(stage, s, (vw-W*s)/2, (vh-H*s)/2);
}
/* 結果頁版面:直向=滿版置中,祝福語在天空;橫向=水晶球在左(30%)、文字欄在右 */
function layoutResult(){
  const vw = innerWidth, vh = innerHeight, st = $('stage2'), ui = $('rui');
  if (wide){
    const s = Math.min(vh/1560, vw*0.52/941);
    const { tx } = place(st, s, vw*0.3 - 470.5*s, (vh - 1672*s)/2);
    ui.style.setProperty('--colL', Math.max(vw*0.47, tx + 860*s + 24) + 'px');
    const globe = RESULT_GLOBES[Math.max(0, pick)];
    const [left, top, right, bottom] = globe.bounds;
    const height = vh * .65 / s, scale = height / (bottom - top);
    const center = -1100 + globe.x * 4241 / 1867;
    const ground = -120 + globe.ground * 1912 / 842;
    const cutout = $('result-globe-image'), logo = $('rlogo-wide'), shadow = $('result-globe-shadow');
    // 背景畫布 s 保持原值；獨立 PNG 有效球體（含木座）高度為視窗 65%。
    Object.assign(cutout.style, {
      left:(center - (left + right) / 2 * scale) + 'px', top:(ground - bottom * scale) + 'px',
      width:globe.width * scale + 'px', height:globe.height * scale + 'px',
      clipPath:`inset(${Math.max(0, top - 10) * scale}px ${Math.max(0, globe.width - right - 10) * scale}px ${Math.max(0, globe.height - bottom - 10) * scale}px ${Math.max(0, left - 10) * scale}px)`
    });
    const logoWidth = height * .26;
    Object.assign(logo.style, {left:(center - logoWidth / 2) + 'px', top:(ground - height * .12 - logoWidth * 121 / 640 / 2) + 'px', width:logoWidth + 'px'});
    const shadowWidth = (right - left) * scale * .78;

    if (pick >= 0 && cutout.getAttribute('src') !== RESULTS[pick].globe) cutout.src = RESULTS[pick].globe;
  } else {

    const rb = document.querySelector('.r-bottom');
    const avail = vh - (rb.offsetHeight + parseFloat(getComputedStyle(rb).bottom || 18)) - 10;
    s = Math.min(s, (avail - 100) / 855);

/* 五種祝福固定兩行、水平置中；以最長的一行計算共同字級，切換場景不跳位。 */
const wishMeasure = document.createElement('canvas').getContext('2d');
function setWish(){
  if (pick < 0) return;
  const el = $('rwish');
  el.replaceChildren(...RESULTS[pick].lines.map(line => {
    const span = document.createElement('span');
    span.textContent = line;
    return span;
  }));
  el.style.removeProperty('--wish-fit');
  const style = getComputedStyle(el), baseSize = parseFloat(style.fontSize);
  wishMeasure.font = `${style.fontWeight} ${style.fontSize} ${style.fontFamily}`;
  const spacing = parseFloat(style.letterSpacing) || 0;
  const longest = Math.max(...RESULTS.flatMap(r => r.lines).map(line =>
    wishMeasure.measureText(line).width + [...line].length * spacing));
  const available = Math.max(1, el.clientWidth - 4);
  const size = Math.min(baseSize, baseSize * available / Math.max(1, longest));
  el.style.setProperty('--wish-fit', `${Math.floor(size * 100) / 100}px`);
}

  balls.push({ el, hx:x, hy:y, d:118, size, x, y, vx:0, vy:0, z:0, ph:rand(0,6.28), sp:rand(2.2,4.2), rot:r0, r0, flip, bias:-.6, vr:0, mascot:true });
});
let biasW = 1;   // 靜止時吉祥物排在雪球後面(才會只露頭);攪動時與雪球前後交錯
function drawBalls(){
  const key = b => b.z + (b.bias || 0) * biasW;
  const order = balls.slice().sort((a,b) => key(a) - key(b));
  order.forEach((b,i) => {
    const sc = 1 + b.z*.16, fl = b.flip || 1;
    b.el.style.zIndex = i;
    b.el.style.transform = `translate(${b.x-b.size/2}px,${b.y-b.size/2}px) scale(${sc*fl},${sc}) rotate(${b.rot}deg)`;
    // 靜止時(z=0)全部不透明,避免吉祥物身體從雪球後面透出;攪動時只有往後飛的雪球稍微變暗,保留遠近感
    b.el.style.opacity = b.mascot ? '1' : (1 - Math.max(0, -b.z) * .16).toFixed(2);
  });
}
function resetBalls(){ balls.forEach(b => { b.x=b.hx; b.y=b.hy; b.vx=b.vy=0; b.z=0; b.rot=b.r0||0; }); biasW = 1; $('globe').classList.remove('stir'); drawBalls(); }
resetBalls();

/* ── 球內雪粉(半解析度畫布) ── */
const pw = $('powder').getContext('2d');
let dust = [];
function windField(p, t, k){
  // 繞中心旋轉的風 + 由下往上的陣風 + 每顆不同的擾動 + 向心力(避免全部貼在球壁)
  const dx = p.x - C.x, dy = p.y - C.y, dist = Math.hypot(dx,dy) || 1;
  const swirl = 1500*k, ph = p.ph || 0;
  return {
    ax: (-dy/dist)*swirl + Math.sin(t*3.1 + ph*5 + p.y*.015)*1600*k - dx*4*k,
    ay: ( dx/dist)*swirl - 700*k + Math.cos(t*2.7 + ph*3 + p.x*.015)*1600*k - dy*4*k,
  };
}
function drawDust(dt, t, k){
  if (k > 0) for (let i=0;i<7;i++) dust.push({ x:rand(260,760), y:rand(770,830), vx:rand(-80,80), vy:rand(-420,-160), r:rand(1.5,4.5), a:rand(.5,1), life:rand(1.4,2.6) });
  pw.clearRect(0,0,512,768);
  dust = dust.filter(p => (p.life -= dt) > 0);
  for (const p of dust){
    if (k > 0){ const f = windField(p,t,k*.7); p.vx += f.ax*dt; p.vy += f.ay*dt; }
    else p.vy += 260*dt;
    p.vx *= .97; p.vy *= .97; p.x += p.vx*dt; p.y += p.vy*dt;
    pw.globalAlpha = Math.min(1, p.life) * p.a;
    pw.fillStyle = '#fff';
    pw.beginPath(); pw.arc(p.x/2, p.y/2, p.r/2, 0, 6.283); pw.fill();
  }
  pw.globalAlpha = 1;
}

/* ── 全畫面飄雪 ── */
const snow = (() => {
  const cv = $('snow'), cx = cv.getContext('2d');
  let W=0, H=0, dpr=1, flakes=[], gust=0;
  function resize(){
    dpr = Math.min(devicePixelRatio||1, 2); W = innerWidth; H = innerHeight;
    cv.width = W*dpr; cv.height = H*dpr; cx.setTransform(dpr,0,0,dpr,0,0);
    const n = Math.round(Math.min(110, W*H/9000));
    while (flakes.length < n) flakes.push(mk(true));
    flakes.length = n;
  }
  function mk(any){ return { x:rand(0,W), y:any?rand(0,H):-10, r:rand(.8,3.2), v:rand(18,55), sw:rand(.5,1.6), ph:rand(0,6.28), a:rand(.45,.95) }; }
  function step(dt, t){
    cx.clearRect(0,0,W,H);
    cx.fillStyle = '#fff';
    for (const f of flakes){
      f.y += (f.v*(1+gust*.8) + f.r*6) * dt;
      f.x += (Math.sin(t*f.sw + f.ph)*14 + gust*320*(.5+f.r/3)) * dt;
      if (f.y > H+10 || f.x > W+20 || f.x < -20){ Object.assign(f, mk(false)); if (gust>.2) { f.x = rand(-W*.4, W*.8); f.y = rand(-10,H*.6); } }
      cx.globalAlpha = f.a; cx.beginPath(); cx.arc(f.x,f.y,f.r,0,6.283); cx.fill();
    }
    cx.globalAlpha = 1;
  }
  return { resize, step, set gust(v){ gust=v; }, get gust(){ return gust; } };
})();

/* ── 碎雪爆開 ── */
const bc = $('burst').getContext('2d');
const atlas = new Image(); atlas.src = 'assets/fragments.webp';
let shards = [], puffs = [];
function explode(x, y, r){
  shards = []; puffs = [];
  const n = reduce ? 8 : 16;
  for (let i=0;i<n;i++){
    const ang = (i/n)*6.283 + rand(-.25,.25), sp = rand(700,1500);
    shards.push({ x:x+Math.cos(ang)*r*.3, y:y+Math.sin(ang)*r*.3, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp-300,
      cell:i%6, s:rand(110,200), rot:rand(0,6.28), vr:rand(-6,6), life:1.6 });
  }
  for (let i=0;i<(reduce?80:320);i++){
    const ang = rand(0,6.283), sp = rand(150,1300);
    puffs.push({ x, y, vx:Math.cos(ang)*sp, vy:Math.sin(ang)*sp, r:rand(2,11), life:rand(.9,1.9) });
  }
}
function drawBurst(dt){
  if (!shards.length && !puffs.length) return;
  bc.clearRect(0,0,1024,1536);
  shards = shards.filter(s => (s.life -= dt) > 0);
  for (const s of shards){
    s.vy += 900*dt; s.vx *= .985; s.x += s.vx*dt; s.y += s.vy*dt; s.rot += s.vr*dt;
    const cw = atlas.naturalWidth/3, ch = atlas.naturalHeight/2;
    bc.save(); bc.globalAlpha = Math.min(1, s.life*1.4); bc.translate(s.x,s.y); bc.rotate(s.rot);
    if (cw) bc.drawImage(atlas, (s.cell%3)*cw, Math.floor(s.cell/3)*ch, cw, ch, -s.s/2, -s.s/2, s.s, s.s);
    bc.restore();
  }
  puffs = puffs.filter(p => (p.life -= dt) > 0);
  bc.fillStyle = '#fff';
  for (const p of puffs){
    p.vx *= .94; p.vy = p.vy*.94 + 60*dt; p.x += p.vx*dt; p.y += p.vy*dt;
    bc.globalAlpha = Math.min(1, p.life); bc.beginPath(); bc.arc(p.x,p.y,p.r,0,6.283); bc.fill();
  }
  bc.globalAlpha = 1;
  if (!shards.length && !puffs.length) bc.clearRect(0,0,1024,1536);
}

/* ── 主迴圈 ── */
let mode = 'idle', modeT = 0, modeStart = 0, last = performance.now(), T = 0;
const WIND = reduce ? .9 : 2.4, SETTLE = .75;
const rig = $('rig');
function loop(now){
  const dt = Math.min(.05, (now-last)/1000); last = now; T += dt;
  modeT = (now - modeStart)/1000;
  snow.step(dt, T);
  if (mode === 'wind' || mode === 'settle'){
    if (mode === 'wind'){
      const k = Math.min(1, modeT/.35) * (modeT > WIND-.3 ? Math.max(0,(WIND-modeT)/.3) : 1);
      snow.gust = k;
      for (const b of balls){
        const f = windField(b, T, k);
        b.vx += (f.ax + rand(-600,600)*k)*dt; b.vy += (f.ay + rand(-600,600)*k)*dt + 900*dt*(1-k);
        b.vx *= .975; b.vy *= .975;
        b.x += b.vx*dt; b.y += b.vy*dt;
        const lim = R - b.d*.5, dx = b.x-C.x, dy = b.y-C.y, d = Math.hypot(dx,dy);
        if (d > lim){ const nx=dx/d, ny=dy/d, dot=b.vx*nx+b.vy*ny; b.x=C.x+nx*lim; b.y=C.y+ny*lim; if (dot>0){ b.vx-=1.7*dot*nx; b.vy-=1.7*dot*ny; } }
        b.z = Math.sin(T*b.sp + b.ph) * k;
        b.rot += (b.vx*.08)*dt*10;
      }
      // 機台輕晃:跟雪球同一個迴圈逐格計算(不用 Web Animations,避免 iPhone/LINE 取消動畫後圖層空白)
      if (!reduce){ const w = Math.sin(modeT * 15) * k; rig.style.transform = `rotate(${(w*1.1).toFixed(3)}deg) translateX(${(w*4).toFixed(2)}px)`; }
      drawDust(dt, T, k);
      if (modeT >= WIND){ rig.style.transform = ''; mode='settle'; modeStart=now; modeT=0; balls.forEach(b => { const r0 = b.r0||0; b.sx=b.x; b.sy=b.y; b.sz=b.z; b.sr = r0 + (((b.rot - r0) % 360) + 540) % 360 - 180; }); }
    } else {
      const p = Math.min(1, modeT/SETTLE), e = 1-Math.pow(1-p,3);
      snow.gust = 0;
      for (const b of balls){
        b.x = b.sx + (b.hx-b.sx)*e;
        b.y = b.sy + (b.hy-b.sy)*e + Math.sin(p*Math.PI)*-18*(1-p);
        b.z = b.sz*(1-e); b.rot = (b.r0||0) + (b.sr - (b.r0||0))*(1-e);
      }
      drawDust(dt, T, 0);
      biasW = .15 + .85*e;
      if (p >= 1){ mode = 'idle'; $('globe').classList.remove('stir'); }
    }
    drawBalls();
  } else if (dust.length) drawDust(dt, T, 0);
  drawBurst(dt);
  requestAnimationFrame(loop);
}

/* ── 出球動畫 ── */
function rollOut(){
  const el = $('ballout'), D = 131, P = (x,y,s,r) => `translate(${x-D/2}px,${y-D/2}px) scale(${s}) rotate(${r}deg)`;
  el.style.setProperty('--glow', 0);
  const anim = el.animate([
    { offset:0,   transform:P(505,1062,.62,0),   opacity:0, filter:'brightness(.3)' },
    { offset:.12, transform:P(505,1088,.8,40),   opacity:1, filter:'brightness(.55)' },
    { offset:.3,  transform:P(508,1172,1.05,140),opacity:1, filter:'brightness(1)' },
    { offset:.46, transform:P(516,1338,1.55,280),opacity:1, filter:'brightness(1.02)', easing:'ease-out' },
    { offset:.55, transform:P(518,1296,1.62,315),opacity:1, filter:'brightness(1.04)', easing:'ease-in' },
    { offset:.62, transform:P(518,1342,1.7,340), opacity:1, filter:'brightness(1.06)', easing:'cubic-bezier(.3,.7,.3,1)' },
    { offset:1,   transform:P(512,770,3.4,420),  opacity:1, filter:'brightness(1.12)' },
  ], { duration: reduce ? 1100 : 2300, fill:'forwards', easing:'linear' });
  setTimeout(() => el.style.setProperty('--glow', 1), reduce ? 600 : 1500);
  const dur = reduce ? 1100 : 2300;
  return Promise.race([anim.finished, sleep(dur + 400)]).then(() => anim);
}

/* ── 流程 ── */
const flash = $('flash');
async function whiteIn(ms){ flash.style.setProperty('--fd', ms+'ms'); flash.classList.add('on'); await sleep(ms+30); }
async function whiteOut(ms){ flash.style.setProperty('--fd', ms+'ms'); flash.classList.remove('on'); await sleep(ms); }

async function makeWish(){
  if (mode !== 'idle') return;
  sfx.wish(WIND + SETTLE*.8 + (reduce ? 1.1 : 2.3), WIND);   // 要在點擊當下(第一個 await 之前)啟動音訊
  const btn = $('wish'); btn.disabled = true;
  mode = 'wind'; modeT = 0; modeStart = performance.now();
  $('globe').classList.add('stir'); biasW = .15;
  if (navigator.vibrate) try { navigator.vibrate(30); } catch(e){}
  await sleep((WIND + SETTLE*.8)*1000);
  const anim = await rollOut();
  // 雪球散開
  $('ballout').style.opacity = 0; anim.cancel(); $('ballout').style.setProperty('--glow',0);
  explode(512, 770, 220);
  sfx.bell();
  if (navigator.vibrate) try { navigator.vibrate([20,40,30]); } catch(e){}
  await sleep(220);
  await whiteIn(reduce ? 400 : 750);
  await showResult();
}

async function showResult(){
  const r = RESULTS[pick], s2 = $('s2'), img = $('rbg');
  s2.style.setProperty('--ink', r.ink); s2.style.setProperty('--key', r.keyc); s2.style.setProperty('--halo', r.halo);
  $('stage2').style.setProperty('--fallback', r.fb);
  s2.dataset.tone = r.tone;
  $('rlogo').style.top = (r.ly - 20) + 'px';
  if (wide) $('result-globe-image').src = r.globe; else $('result-globe-image').removeAttribute('src');
  img.style.visibility = '';   // 清除先前的隱藏狀態;不可設成 visible,否則會蓋過場景切換而一直顯示
  img.src = r.img;
  if (wide) $('rbgw').src = r.wide; else $('rbgw').removeAttribute('src');
  layoutResult();
  await Promise.race([img.complete && img.naturalWidth ? Promise.resolve() : new Promise(r => { img.onload = r; img.onerror = () => { img.style.visibility = 'hidden'; r(); }; }), sleep(4000)]);
  if (wide) {
    const wideImg = $('rbgw');
    await Promise.race([Promise.all([wideImg.decode().catch(() => {}), $('result-globe-image').decode().catch(() => {})]), sleep(4000)]);
  }
  document.body.classList.add('result-view');
  $('backdrop').style.backgroundImage = `url(${wide ? r.wide : r.img})`;
  $('s1').classList.remove('active');
  s2.classList.add('active'); s2.classList.remove('show');
  await sleep(250);
  whiteOut(reduce ? 400 : 1000);
  await sleep(250);
  s2.classList.add('show');
  sfx.music(pick, .6);   // 結果頁配樂:每張一首,鈴聲餘音後接上
  const vis = [...document.querySelectorAll('#s2 .replay')].find(b => b.offsetParent);
  if (vis) vis.focus({preventScroll:true});
}

/* 回首頁時強制首頁整層重畫:iPhone Safari / LINE(WebKit)在「隱藏→重新顯示」時,
   偶爾不會重畫剛做過動畫、又有球形裁切的機台圖層,造成機台空白。趁畫面全白時做,看不出閃動。 */
function repaintHome(){
  const st = $('stage1');
  st.style.display = 'none'; void st.offsetHeight; st.style.display = '';
  layout();
}

async function replay(){
  sfx.stopMusic();
  await whiteIn(450);
  document.body.classList.remove('result-view');
  $('s2').classList.remove('active','show');
  $('s1').classList.add('active');
  $('backdrop').style.backgroundImage = `url(${wide ? 'assets/bg-wide.jpg' : 'assets/bg-stage.jpg'})`;
  rig.style.transform = ''; resetBalls(); dust = []; mode = 'idle';
  repaintHome();
  const btn = $('wish'); btn.disabled = false;
  choose();
  await whiteOut(600);
  btn.focus({preventScroll:true});
}

/* ── 啟動:等第一幕素材載入完才顯示 ── */
async function boot(){
  layout();
  addEventListener('resize', layout);
  // 有些 App 內建瀏覽器在視窗就緒後不一定送 resize:多聽幾個來源,統一排到下一格重排
  let relayoutQueued = false;
  const relayout = () => { if (relayoutQueued) return; relayoutQueued = true; requestAnimationFrame(() => { relayoutQueued = false; layout(); }); };
  addEventListener('orientationchange', relayout);
  addEventListener('pageshow', relayout);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) relayout(); });
  if (window.visualViewport) visualViewport.addEventListener('resize', relayout);
  if (window.ResizeObserver) new ResizeObserver(relayout).observe(document.documentElement);
  // 防護2:圖片下載失敗(網路不穩)自動重試 3 次,避免機台某一層一直空白
  document.querySelectorAll('img').forEach(img => {
    const retry = () => {
      const n = +(img.dataset.retry || 0), src = img.getAttribute('src');
      if (!src || n >= 3) return;
      img.dataset.retry = n + 1;
      setTimeout(() => { img.src = src.split('?')[0] + '?retry=' + (n + 1); }, 600 * (n + 1));
    };
    img.addEventListener('error', retry);
    if (img.complete && img.getAttribute('src') && !img.naturalWidth) retry();   // 在程式執行前就已失敗的
  });
  const imgs = [...document.querySelectorAll('#s1 img')];
  await Promise.race([
    Promise.all(imgs.map(i => i.complete ? Promise.resolve() : new Promise(r => { i.onload = i.onerror = r; }))),
    sleep(6000),
  ]);
  $('loader').classList.add('done');
  choose();
  preload('assets/logo-white.webp'); preload('assets/title-silver.webp');
  if (document.fonts){
    document.fonts.ready.then(() => setWish());
    document.fonts.addEventListener('loadingdone', () => setWish());
  }
  $('wish').disabled = false;   // 防護3:確保按鈕不沿用上次的停用狀態
  $('wish').addEventListener('click', makeWish);
  document.querySelectorAll('.replay').forEach(b => b.addEventListener('click', replay));
  const sb = $('sound');
  sb.setAttribute('aria-pressed', String(sfx.on));
  sb.addEventListener('click', () => sb.setAttribute('aria-pressed', String(sfx.toggle())));
  // 檢查用:網址加 ?preview=1~5 直接看指定結果頁
  const pv = parseInt(new URLSearchParams(location.search).get('preview'), 10);
  if (pv >= 1 && pv <= RESULTS.length){ pick = pv - 1; $('wish').disabled = true; mode = 'done'; showResult(); }
  requestAnimationFrame(t => { last = t; requestAnimationFrame(loop); });
}
boot();
// 防護3:從「上一頁」或背景還原時,瀏覽器可能直接拿出動畫半途的舊畫面 → 重新載入成乾淨的首頁
addEventListener('pageshow', e => { if (e.persisted) location.reload(); });
})();
</script>
